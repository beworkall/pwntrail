name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke test the CLI
        run: |
          export PWNTRAIL_HOME="$RUNNER_TEMP/pt"
          pwntrail new ci-case --scope 10.10.10.0/24 --client "CI"
          pwntrail import examples/scans
          pwntrail finding list
          pwntrail report -F html -F md
          pwntrail timeline
          pwntrail verify
